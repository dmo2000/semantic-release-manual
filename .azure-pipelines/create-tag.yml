trigger: none

parameters:
  - name: bumpType
    displayName: "bump type"
    type: string
    default: "patch"
    values:
      - major
      - minor
      - patch
  - name: bumpNumber
    displayName: "Bump number"
    type: string
    default: "0"

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: true

  - task: ManualValidation@1
    displayName: 'Require manual approval before tagging/publishing'
    inputs:
      instructions: |
        Review the pending release and approve to continue.
        Bump type: ${{ parameters.bumpType }}, bump number: ${{ parameters.bumpNumber }}.
      onTimeout: 'reject'
      timeout: '10'
    condition: and(succeeded(), ne(parameters['bumpType'], 'patch'))

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: |
      npm ci
    displayName: Install dependencies

  - script: |
      npx semantic-release
    displayName: Run semantic-release setting ${{ parameters.bumpType }} version to ${{ parameters.bumpNumber }}
    env:
      SEMANTIC_RELEASE_BUMP_TYPE: ${{ parameters.bumpType }}
      SEMANTIC_RELEASE_BUMP_NUMBER: ${{ parameters.bumpNumber }}
      GITHUB_TOKEN: $(GITHUB_TOKEN)
