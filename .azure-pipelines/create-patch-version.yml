trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: true

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: |
      npm ci
    displayName: Install dependencies

  - script: |
      npx semantic-release
    displayName: Run semantic-release
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)
